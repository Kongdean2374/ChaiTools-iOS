name: ChaiTools
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.2.0'
    CURRENT_PROJECT_VERSION: '2'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    GENERATE_INFOPLIST_FILE: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  ChaiTools:
    type: application
    platform: iOS
    sources:
      - path: ChaiTools
        excludes: ['*.plist', '*.entitlements']
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        INFOPLIST_FILE: ChaiTools/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ChaiTools/ChaiTools.entitlements
    dependencies:
      - target: ChaiToolsKeyboard
        embed: true
        codeSign: false
  ChaiToolsKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: ChaiToolsKeyboard
        excludes: ['*.plist', '*.entitlements']
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).Keyboard
        INFOPLIST_FILE: ChaiToolsKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: ChaiToolsKeyboard/ChaiToolsKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  ChaiTools:
    build:
      targets:
        ChaiTools: all
        ChaiToolsKeyboard: all
    run:
      config: Debug
    archive:
      config: Release
