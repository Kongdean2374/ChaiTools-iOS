name: Build unsigned iPhone IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and verify unsigned device IPA
        run: bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ChaiTools-unsigned-IPA
          path: |
            dist/ChaiTools-unsigned.ipa
            dist/ChaiTools-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
